name: Build macOS arm64 (manual)

# Disparo manual a proposito: el repo es publico, y macOS consume la bolsa de
# minutos gratis de Actions a 10x contra Linux/Windows -- mejor gastarla solo
# cuando de verdad hace falta, no en cada push.
#
# SOLO arm64 (Apple Silicon): es el unico build de macOS que el maintainer no
# puede producir en su propia maquina. El x64 se compila en una VM local.
#
# Con "publish" activado (viene apagado), ademas de compilar arma
# DowP-<version>-arm64.dmg y lo sube al release v<APP_VERSION>, creandolo si no existe.
# macOS no publica chunks ni toca el manifiesto, asi que no necesita la clave de firma:
# reemplazar un bundle archivo por archivo lo rompe, y la app se actualiza con el .dmg.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Subir el .dmg al release (si no, solo compila)"
        type: boolean
        default: false
      tipo:
        description: "Tipo de release, si no existe aun. Una version -beta.N siempre es prerelease"
        type: choice
        options:
          - prerelease
          - estable
        default: prerelease

permissions:
  contents: write

# El mismo grupo en los workflows que suben al release, para que se encolen.
concurrency:
  group: publish-macos
  cancel-in-progress: false

jobs:
  build-macos-arm64:
    runs-on: macos-15   # Apple Silicon -- el caso estricto: sin firma no arranca
    env:
      # Lo que se compile aqui debe seguir abriendo en macOS 14, el minimo de PySide6 6.12.
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install pyinstaller==6.22.2

      - name: Compilar DowP (DowP.app, firma ad-hoc incluida)
        working-directory: app
        run: python build_cross_platform.py

      - name: "Leer version de la app (unica fuente: core/version.py)"
        id: appver
        working-directory: app
        run: |
          VERSION=$(python -c "import sys; sys.path.insert(0,'src'); from core.version import APP_VERSION; print(APP_VERSION)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Comprobar el bundle (arquitectura y firma)
        run: |
          file app/dist/DowP.app/Contents/MacOS/DowP | grep -q arm64
          codesign --verify --deep --strict app/dist/DowP.app
          echo "Bundle OK"

      - name: Empaquetar el .app preservando firma/atributos (ditto, no zip normal)
        # ditto (no un zip generico) preserva la firma ad-hoc y los symlinks del
        # bundle. Queda como artifact para poder bajarlo y probarlo a mano.
        working-directory: app/dist
        run: ditto -c -k --keepParent DowP.app DowP-${{ steps.appver.outputs.version }}-arm64-app.zip

      - name: Subir el .app como artifact
        uses: actions/upload-artifact@v4
        with:
          name: DowP-${{ steps.appver.outputs.version }}-arm64-app
          path: app/dist/DowP-${{ steps.appver.outputs.version }}-arm64-app.zip
          retention-days: 5

      # Despues de subir el artifact, y sin hacer fallar la corrida: el build ya esta
      # disponible aunque esta prueba falle, y aqui se ve el motivo. No impide publicar.
      - name: Prueba de arranque (sin pantalla, 25 s)
        continue-on-error: true
        run: |
          QT_QPA_PLATFORM=offscreen app/dist/DowP.app/Contents/MacOS/DowP &
          PID=$!
          sleep 25
          if kill -0 "$PID" 2>/dev/null; then
            echo "Sigue abierto a los 25 s: arranca."
            kill "$PID"
          else
            wait "$PID"; echo "Se cerro solo, codigo $?"
            exit 1
          fi

      - name: Armar el .dmg (con acceso directo a Aplicaciones)
        if: ${{ inputs.publish }}
        run: |
          DMG_DIR="$RUNNER_TEMP/dmg-arm64"
          rm -rf "$DMG_DIR" && mkdir -p "$DMG_DIR"
          ditto app/dist/DowP.app "$DMG_DIR/DowP.app"
          ln -s /Applications "$DMG_DIR/Applications"
          hdiutil create -volname "DowP" -srcfolder "$DMG_DIR" -ov -format UDZO \
            "app/dist/DowP-${{ steps.appver.outputs.version }}-arm64.dmg"

      - name: Crear el release si no existe y subir el .dmg
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TIPO: ${{ inputs.tipo }}
          VERSION: ${{ steps.appver.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          if ! gh release view "v$VERSION" --repo "$REPO" > /dev/null 2>&1; then
            FLAG=""
            case "$VERSION" in *-*) FLAG="--prerelease" ;; esac
            if [ "$TIPO" = "prerelease" ]; then FLAG="--prerelease"; fi
            gh release create "v$VERSION" --repo "$REPO" --target "$GITHUB_SHA" --title "v$VERSION" --notes "" $FLAG
          fi
          gh release upload "v$VERSION" "app/dist/DowP-$VERSION-arm64.dmg" --clobber --repo "$REPO"
