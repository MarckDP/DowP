<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DowP - Descarga</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>DowP</h1>
        
        <div class="download-section">
            <a href="#" id="main-download-btn" class="btn primary">
                <span id="btn-text">Detectando tu sistema...</span>
            </a>
            
            <div class="alt-downloads">
                <p>Otras versiones disponibles:</p>
                <div class="cards">
                    <a href="#" id="link-win" class="card">
                        <strong>Windows</strong>
                        <span>(.exe)</span>
                    </a>
                    <a href="#" id="link-mac-silicon" class="card">
                        <strong>macOS (Apple Silicon)</strong>
                        <span>(.dmg)</span>
                    </a>
                    <!-- Oculta hasta volver a tener build Intel: quitar "hidden" y poner MAC_INTEL_AVAILABLE = true en script.js -->
                    <a href="#" id="link-mac-intel" class="card" hidden>
                        <strong>macOS (Intel)</strong>
                        <span>(.dmg)</span>
                    </a>
                </div>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
