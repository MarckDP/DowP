name: Build Linux x64 (manual)

# Compila DowP para Linux x64 y lo deja como artifact descargable. Si se marca
# "publish", y solo si pasa la prueba de arranque, publica ademas los chunks de
# linux-x64 y sube el .tar.gz al release.
#
# "publish" viene apagado: Linux nunca se ha probado en una maquina real, y publicar
# ofrece actualizaciones a quien ya lo tenga instalado.
#
# ubuntu-22.04 y no latest: un binario de PyInstaller necesita una glibc igual o
# mas nueva que la de donde se compilo, asi que compilar en una base vieja lo deja
# correr en mas distribuciones.
#
# El artifact lleva la version y el commit (DowP-1.9.4-a1b2c3d-linux-x64). Es un
# .tar.gz para conservar permisos de ejecucion y symlinks. Para probarlo:
#   tar xzf DowP-*.tar.gz && ./DowP/DowP
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publicar chunks de linux-x64 y subir el .tar.gz al release (si no, solo compila)"
        type: boolean
        default: false
      tipo:
        description: "Tipo de release, si no existe aun. Una version -beta.N siempre es prerelease"
        type: choice
        options:
          - prerelease
          - estable
        default: prerelease
      reemplazar_chunks:
        description: "Volver a subir todos los chunks de esta plataforma (solo para reparar una version publicada)"
        type: boolean
        default: false

permissions:
  contents: write

# El MISMO grupo que los workflows de Mac: se encolan entre si en vez de pisarse el
# manifiesto.
concurrency:
  group: publish-macos
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar librerias de sistema que Qt necesita
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libdbus-1-3 libnss3 libpulse-mainloop-glib0 \
            libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 \
            libxcb-xinerama0

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary -r app/requirements.txt
          pip install pyinstaller==6.22.2

      - name: Compilar DowP (carpeta DowP/ + helper de swap)
        working-directory: app
        run: python build_cross_platform.py

      - name: "Nombre del artifact (version de core/version.py + commit)"
        id: name
        working-directory: app
        run: |
          VERSION=$(python -c "import sys; sys.path.insert(0,'src'); from core.version import APP_VERSION; print(APP_VERSION)")
          echo "base=DowP-$VERSION-${GITHUB_SHA::7}-linux-x64" >> "$GITHUB_OUTPUT"

      - name: Comprobar el resultado
        run: |
          test -x app/dist/DowP/DowP
          test -x app/dist/DowP/DowP_Updater
          echo "Build OK"

      - name: Empaquetar (tar conserva permisos y symlinks)
        working-directory: app/dist
        run: tar czf ${{ steps.name.outputs.base }}.tar.gz DowP

      - name: Subir como artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.base }}
          path: app/dist/${{ steps.name.outputs.base }}.tar.gz
          retention-days: 7

      # Despues de subir, y sin hacer fallar la corrida: el build ya esta disponible
      # aunque esta prueba falle, y aqui se ve el motivo (modulo o libreria faltante).
      - name: Prueba de arranque (sin pantalla, 25 s)
        id: arranque
        continue-on-error: true
        run: |
          QT_QPA_PLATFORM=offscreen ./app/dist/DowP/DowP &
          PID=$!
          sleep 25
          if kill -0 "$PID" 2>/dev/null; then
            echo "Sigue abierto a los 25 s: arranca."
            kill "$PID"
          else
            wait "$PID"; echo "Se cerro solo, codigo $?"
            exit 1
          fi

      - name: Escribir la clave privada de firma
        if: ${{ inputs.publish && steps.arranque.outcome == 'success' }}
        env:
          UPDATER_PRIVATE_KEY: ${{ secrets.UPDATER_PRIVATE_KEY }}
        run: |
          if [ -z "$UPDATER_PRIVATE_KEY" ]; then
            echo "Falta el secret UPDATER_PRIVATE_KEY (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          mkdir -p tools/updater/secrets
          printf '%s\n' "$UPDATER_PRIVATE_KEY" > tools/updater/secrets/private_key.pem
          chmod 600 tools/updater/secrets/private_key.pem

      - name: Publicar chunks de linux-x64
        if: ${{ inputs.publish && steps.arranque.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TIPO: ${{ inputs.tipo }}
          REEMPLAZAR: ${{ inputs.reemplazar_chunks }}
        run: |
          FLAG=""
          if [ "$TIPO" = "prerelease" ]; then FLAG="--prerelease"; fi
          if [ "$REEMPLAZAR" = "true" ]; then FLAG="$FLAG --replace-chunks"; fi
          python tools/updater/publish.py \
            --dist app/dist/DowP \
            --platform linux-x64 \
            --repo "${{ github.repository }}" \
            --private-key tools/updater/secrets/private_key.pem \
            $FLAG

      - name: Borrar la clave privada del runner
        if: ${{ always() }}
        run: rm -f tools/updater/secrets/private_key.pem

      - name: Subir el .tar.gz al release
        if: ${{ inputs.publish && steps.arranque.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(cd app && python -c "import sys; sys.path.insert(0,'src'); from core.version import APP_VERSION; print(APP_VERSION)")
          cp "app/dist/${{ steps.name.outputs.base }}.tar.gz" "app/dist/DowP-$VERSION-linux-x64.tar.gz"
          gh release upload "v$VERSION" "app/dist/DowP-$VERSION-linux-x64.tar.gz" \
            --clobber --repo "${{ github.repository }}"

      - name: Comprobar el manifiesto publicado
        if: ${{ inputs.publish && steps.arranque.outcome == 'success' }}
        run: |
          VERSION=$(cd app && python -c "import sys; sys.path.insert(0,'src'); from core.version import APP_VERSION; print(APP_VERSION)")
          curl -sL "https://github.com/${{ github.repository }}/releases/download/v$VERSION/manifest.json" \
            | python -c "import json,sys; m=json.load(sys.stdin); p=sorted(m['platforms']); print(m['app_version'], p); sys.exit(0 if 'linux-x64' in p else 1)"
